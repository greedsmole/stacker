name: Build, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-macos-arm64
          path: '**/TestResults/*.trx'
  package:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/package.py osx-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: Stacker-osx-arm64
          path: |
            artifacts/Stacker-*.zip
            artifacts/Stacker-*.tar.gz
